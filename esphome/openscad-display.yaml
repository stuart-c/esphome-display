substitutions:
  name: "openscad-display"
  friendly_name: "OpenSCAD Display"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

# PSRAM configuration (required for display buffering)
psram:
  mode: octal
  speed: 80MHz

# I2C Bus for Touchscreen and Audio Codec (ES8311)
i2c:
  - id: i2c_bus
    sda: GPIO38
    scl: GPIO39
    frequency: 400kHz

# SPI Bus for LCD Display (Quad Mode)
spi:
  - id: display_spi
    type: quad
    clk_pin: GPIO12
    data_pins: [GPIO11, GPIO13, GPIO14, GPIO9]

# Enable logging
logger:

# Enable Home Assistant API
api:

# Enable OTA updates
ota:
  - platform: esphome

# WiFi configuration (uses pre-stored credentials, fallback to AP on failure)
wifi:
  ap:
    ssid: "OpenSCAD Display Hotspot"

captive_portal:

# Fonts for on-screen text rendering
font:
  - file: "gfonts://Roboto"
    id: font_display
    size: 24

# LCD Display Component
display:
  - platform: mipi_spi
    id: screen
    model: JC3248W535
    cs_pin: GPIO10
    data_rate: 40MHz
    rotation: 90
    dimensions:
      height: 480
      width: 320
    lambda: |-
      it.printf(it.get_width() / 2, it.get_height() / 2, id(font_display), TextAlign::CENTER, "OpenSCAD Display");

# Backlight PWM Output
output:
  - id: backlight_pwm
    platform: ledc
    pin: GPIO41

# LED & Backlight Controls
light:
  - platform: esp32_rmt_led_strip
    id: onboard_rgb
    name: "Onboard RGB LED"
    pin: GPIO40
    num_leds: 1
    rgb_order: GRB
    chipset: ws2812
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON

# Capacitive Touchscreen
touchscreen:
  - platform: axs15231
    id: touch_screen
    display: screen
    i2c_id: i2c_bus
    reset_pin: GPIO48
    interrupt_pin: GPIO47
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: true

# Physical BOOT Button
binary_sensor:
  - platform: gpio
    id: screen_button
    pin:
      number: GPIO0
      ignore_strapping_warning: true
    name: "Screen Button"
    on_press:
      - media_player.play_media:
          id: speaker_output
          media_url: "audio-file://wake_word_triggered_sound"

# Audio Codec (ES8311)
audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: i2c_bus

# I2S Audio Bus
i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO21
    i2s_bclk_pin: GPIO18
    i2s_mclk_pin: GPIO17

# Speaker Component
speaker:
  - platform: i2s_audio
    id: onboard_speaker
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO15
    dac_type: external

# Amplifier Switch
switch:
  - platform: gpio
    name: "Speaker Amplifier"
    id: speaker_amp
    pin:
      number: GPIO1
      inverted: true
    restore_mode: ALWAYS_OFF

# Sendspin Hub
sendspin:
  id: sendspin_hub
  task_stack_in_psram: true

# Local Audio Files Embedded in Flash
audio_file:
  - id: wake_word_triggered_sound
    file: "https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/wake_word_triggered.flac"

# Media Sources
media_source:
  - platform: audio_file
    id: local_file_source
  - platform: sendspin
    id: sendspin_source
    sample_rate: 16000
  - platform: audio_http
    id: http_source

# Speaker Output Media Player
media_player:
  - platform: speaker_source
    name: "Speaker"
    id: speaker_output
    media_pipeline:
      speaker: onboard_speaker
      sources:
        - local_file_source
        - sendspin_source
        - http_source
    on_play:
      - switch.turn_on: speaker_amp
    on_idle:
      - switch.turn_off: speaker_amp
  - platform: sendspin
    id: sendspin_group_media_player
    name: "Sendspin Player"

# Microphone Input
microphone:
  - platform: i2s_audio
    id: onboard_mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO16
    adc_type: external
    pdm: false


substitutions:
  name: "openscad-display"
  friendly_name: "OpenSCAD Display"

packages:
  display: !include display.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

# PSRAM configuration (required for display buffering)
psram:
  mode: octal
  speed: 80MHz

# I2C Bus for Touchscreen and Audio Codec (ES8311)
i2c:
  - id: i2c_bus
    sda: GPIO38
    scl: GPIO39
    frequency: 400kHz


# Enable logging
logger:

# Enable Home Assistant API
api:

# Enable OTA updates
ota:
  - platform: esphome

# WiFi configuration (uses pre-stored credentials, fallback to AP on failure)
wifi:
  ap:
    ssid: "OpenSCAD Display Hotspot"

captive_portal:

# LED Controls
light:
  - platform: esp32_rmt_led_strip
    id: onboard_rgb
    name: "Onboard RGB LED"
    pin: GPIO40
    num_leds: 1
    rgb_order: GRB
    chipset: ws2812

# Physical BOOT Button
binary_sensor:
  - platform: gpio
    id: screen_button
    pin:
      number: GPIO0
      ignore_strapping_warning: true
    name: "Screen Button"
    on_press:
      - media_player.play_media:
          id: speaker_output
          media_url: "audio-file://wake_word_triggered_sound"

# Audio Codec (ES8311)
audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: i2c_bus

# I2S Audio Bus
i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO21
    i2s_bclk_pin: GPIO18
    i2s_mclk_pin: GPIO17

# Speaker Component
speaker:
  - platform: i2s_audio
    id: onboard_speaker
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO15
    dac_type: external

# Amplifier Switch
switch:
  - platform: gpio
    name: "Speaker Amplifier"
    id: speaker_amp
    pin:
      number: GPIO1
      inverted: true
    restore_mode: ALWAYS_OFF

# Sendspin Hub
sendspin:
  id: sendspin_hub
  task_stack_in_psram: true

# Local Audio Files Embedded in Flash
audio_file:
  - id: wake_word_triggered_sound
    file: "https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/wake_word_triggered.flac"

# Media Sources
media_source:
  - platform: audio_file
    id: local_file_source
  - platform: sendspin
    id: sendspin_source
    sample_rate: 16000
  - platform: audio_http
    id: http_source

# Speaker Output Media Player
media_player:
  - platform: speaker_source
    name: "Speaker"
    id: speaker_output
    media_pipeline:
      speaker: onboard_speaker
      sources:
        - local_file_source
        - sendspin_source
        - http_source
    on_play:
      - switch.turn_on: speaker_amp
    on_idle:
      - switch.turn_off: speaker_amp
  - platform: sendspin
    id: sendspin_group_media_player
    name: "Sendspin Player"

# Microphone Input
microphone:
  - platform: i2s_audio
    id: onboard_mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO16
    adc_type: external
    pdm: false


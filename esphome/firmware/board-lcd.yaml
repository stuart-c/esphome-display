substitutions:
  # ===== I2C Configuration =====
  i2c_sda: GPIO38
  i2c_scl: GPIO39

  # ===== I2S Audio Configuration (Microphone only) =====
  i2s_mclk: GPIO17
  i2s_bclk: GPIO18
  i2s_lrclk: GPIO21
  i2s_din: GPIO15
  # DOUT is not used since speaker output is disabled, but we keep it mapped to an unused pin to prevent compile errors.
  i2s_dout: GPIO16

  # ===== Screen Button (BOOT button) =====
  screen_button_pin: GPIO0
  # Map the unused center button to a free/internal GPIO to maintain software compatibility without triggering events.
  center_button_pin: GPIO46

  # ===== Display Backlight and Control =====
  backlight_pin: GPIO41
  display_cs: GPIO10
  display_dc: GPIO42

  # ===== SPI Display Pins (Quad Mode) =====
  spi_clk: GPIO12
  spi_d0: GPIO11
  spi_d1: GPIO13
  spi_d2: GPIO14
  spi_d3: GPIO9

  # ===== Audio Amp Enable (Keep disabled/low) =====
  amp_pin:
    number: GPIO1
    ignore_strapping_warning: true

# Page-cycling button (BOOT button on GPIO 0)
binary_sensor:
  - platform: gpio
    id: screen_button
    pin:
      number: ${screen_button_pin}
      ignore_strapping_warning: true
    name: Screen Button
    disabled_by_default: true
    entity_category: diagnostic
    on_multi_click:
      - timing:
          - ON for at least 50ms
          - OFF for at least 50ms
        then:
          - select.next: screen_name

# Expose the single NeoPixel RGB LED on GPIO 40
light:
  - platform: neopixel
    id: status_led
    pin: GPIO40
    num_leds: 1
    name: "Status LED"
    variant: WS2812

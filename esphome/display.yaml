# SPI Bus for LCD Display (Quad Mode)
spi:
  - id: display_spi
    type: quad
    clk_pin: GPIO12
    data_pins: [GPIO11, GPIO13, GPIO14, GPIO9]

# Fonts for on-screen text rendering
font:
  - file: "gfonts://Roboto"
    id: font_display
    size: 24

# LCD Display Component
display:
  - platform: mipi_spi
    id: screen
    model: JC3248W535
    cs_pin: GPIO10
    data_rate: 40MHz
    rotation: 90
    dimensions:
      height: 480
      width: 320
    lambda: |-
      it.printf(it.get_width() / 2, it.get_height() / 2, id(font_display), TextAlign::CENTER, "OpenSCAD Display");

# Backlight PWM Output
output:
  - id: backlight_pwm
    platform: ledc
    pin: GPIO41

# LED & Backlight Controls
light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON

# Capacitive Touchscreen
touchscreen:
  - platform: axs15231
    id: touch_screen
    display: screen
    i2c_id: i2c_bus
    reset_pin: GPIO48
    interrupt_pin: GPIO47
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: true

name: Build STL Files

on:
  push:
    paths:
      - 'openscad/**'
  pull_request:
    paths:
      - 'openscad/**'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Install OpenSCAD & xvfb
      run: |
        sudo apt-get update
        sudo apt-get install -y openscad xvfb

    - name: Run build script
      run: ./openscad/build.sh

    - name: Generate Renders
      run: |
        xvfb-run --auto-servernum bash -ec '
          openscad -o openscad/assembled_preview.png --colorscheme="Tomorrow" -D "part_to_render=3" --camera=0,0,0,55,0,25,100 --autocenter --viewall --imgsize=800,600 openscad/enclosure.scad
          openscad -o openscad/front_preview.png --colorscheme="Tomorrow" -D "part_to_render=4" --camera=0,0,0,55,0,25,100 --autocenter --viewall --imgsize=800,600 openscad/enclosure.scad
          openscad -o openscad/rear_preview.png --colorscheme="Tomorrow" -D "part_to_render=5" --camera=0,0,0,55,0,25,100 --autocenter --viewall --imgsize=800,600 openscad/enclosure.scad
        '

    - name: Auto-commit Renders
      uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
      with:
        commit_message: "style: regenerate enclosure renders [skip ci]"
        file_pattern: 'openscad/*.png'

    - name: Add Renders to Job Summary
      run: |
        echo "### 3D Previews of the Enclosure" >> $GITHUB_STEP_SUMMARY
        echo "#### Assembled View" >> $GITHUB_STEP_SUMMARY
        echo "![Assembled View](https://raw.githubusercontent.com/${{ github.repository }}/${{ github.head_ref || github.ref_name }}/openscad/assembled_preview.png)" >> $GITHUB_STEP_SUMMARY
        echo "#### Front Cover (Outside)" >> $GITHUB_STEP_SUMMARY
        echo "![Front Cover](https://raw.githubusercontent.com/${{ github.repository }}/${{ github.head_ref || github.ref_name }}/openscad/front_preview.png)" >> $GITHUB_STEP_SUMMARY
        echo "#### Rear Cover (Outside)" >> $GITHUB_STEP_SUMMARY
        echo "![Rear Cover](https://raw.githubusercontent.com/${{ github.repository }}/${{ github.head_ref || github.ref_name }}/openscad/rear_preview.png)" >> $GITHUB_STEP_SUMMARY

    - name: Upload STLs as Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: enclosure-stls
        path: openscad/dist/
        if-no-files-found: error
        retention-days: 90

    - name: Update Pre-release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: latest
        prerelease: true
        files: |
          openscad/dist/front_cover.stl
          openscad/dist/rear_cover.stl
          openscad/dist/print_layout.stl
        name: "Latest Enclosure Builds"
        body: "This pre-release contains the latest automatically built STL files from the main branch."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
